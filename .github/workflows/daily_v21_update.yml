name: 台股 V21.8 每日盤後全自動更新

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
      - 'README.md'
  schedule:
    # 週一至週五 台灣時間 15:45 盤後主更新（UTC 07:45）
    - cron: '45 7 * * 1-5'
    # 週一至週五 台灣時間 18:10 補跑校準（UTC 10:10，確保 TAIFEX 期貨與上櫃法人完整入庫）
    - cron: '10 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. 檢出最新 main 分支
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 2. 自動歸位資料夾結構（支援手機直接覆蓋上傳）
        run: |
          mkdir -p scripts data
          if [ -f "v21_ci.py" ]; then mv -f "v21_ci.py" "scripts/v21_ci.py"; fi
          for f in v21_latest.json kline_bundle.json macro_config.json v21_hist.json dual_alert_backtest.json taiex_regime_backtest.json V21_最新每日報告.md V21_全市場評分_最新.csv; do
            if [ -f "$f" ]; then mv -f "$f" "data/$f"; fi
          done

      - name: 3. 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. 執行 V21.8 全市場盤後分析與 2 年位階回測
        run: python3 -B scripts/v21_ci.py

      - name: 5. 自動提交最新盤後資料（防衝突自動重試）
        run: |
          git config user.name "V21 Auto Bot"
          git config user.email "v21-bot@users.noreply.github.com"

          rm -rf /tmp/v21_fresh_data
          cp -r data /tmp/v21_fresh_data

          PUSH_OK=0
          for i in 1 2 3; do
            git fetch origin main
            git checkout -f -B main origin/main
            git clean -fd data/
            mkdir -p scripts data
            if [ -f "v21_ci.py" ]; then mv -f "v21_ci.py" "scripts/v21_ci.py"; fi
            cp -rf /tmp/v21_fresh_data/. data/
            git add -A scripts/ data/
            git add -u
            if git diff --staged --quiet; then
              echo "今日資料無變動，略過提交。"
              PUSH_OK=1
              break
            fi
            TW_DATE=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M')
            git commit -m "📊 自動更新台股 V21.8 盤後戰情 (${TW_DATE} CST)"
            if git push origin main; then
              echo "✅ 成功寫入 main 分支！"
              PUSH_OK=1
              break
            fi
            echo "⚠️ 遠端 main 剛有新上傳，3 秒後自動重新對齊再推送（第 ${i}/3 次）..."
            sleep 3
          done
          rm -rf /tmp/v21_fresh_data
          if [ "$PUSH_OK" -ne 1 ]; then
            echo "❌ 連續 3 次推送仍遇衝突，請稍後手動執行 Run workflow。"
            exit 1
          fi

      - name: 6. 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 7. 打包網站與最新盤後資料
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 8. 等待成品索引完成
        run: sleep 8

      - name: 9. 發布至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
